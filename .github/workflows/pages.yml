name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger: type any branch name into the "branch" field that appears
  # on the "Run workflow" screen (free-text input, so it works for every
  # branch without editing this file).
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and publish to Pages (e.g. main, dev, feature/x)"
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual runs: check out the branch typed into the "branch" input
          # (falls back to the branch the workflow was launched from).
          # Push runs: check out the pushed branch as usual.
          ref: ${{ inputs.branch || github.ref_name }}

      # Static site: index.html lives at the repo root, so publish it directly.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
