name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger: pick any branch (and optionally a specific commit SHA)
  # from the "Run workflow" dropdown on the Actions tab.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build and deploy from"
        required: true
        default: main
        type: choice
        options:
          - main
          # Add your other branch names here so they appear in the dropdown, e.g.:
          # - dev
          # - feature/experiment
      sha:
        description: "Optional exact commit SHA (leave empty to use the branch head)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When triggered manually, build from the selected branch/tag (and
          # optional SHA); otherwise check out the branch that triggered the run.
          ref: ${{ inputs.ref || github.ref }}
          sha: ${{ inputs.sha || '' }}

      # Static site: index.html lives at the repo root, so publish it directly.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
